version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: govt_scheme_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: govt_scheme_db
      MYSQL_USER: scheme_user
      MYSQL_PASSWORD: scheme_password
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - govt_scheme_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10
      interval: 10s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govt_scheme_backend
    environment:
      DATABASE_URL: mysql+pymysql://scheme_user:scheme_password@mysql:3306/govt_scheme_db
      ENVIRONMENT: production
      DEBUG: "False"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      LOG_LEVEL: INFO
      SECRET_KEY: your-production-secret-key-change-this
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - govt_scheme_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 10s
      retries: 5
      interval: 10s
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  govt_scheme_network:
    driver: bridge
